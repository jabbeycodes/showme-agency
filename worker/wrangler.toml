# =============================================================================
# Cloudflare Worker config for the ShowMe Digital Agency site.
#
# The Worker serves the generated static site (../public) via Workers Static
# Assets, and runs custom code ONLY for /api/* (lead capture + analytics),
# falling back to the static assets for every other path.
#
# NOTE: This is NOT deployed automatically. See ../README.md for redeploy steps.
# =============================================================================
name = "showme-agency"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Serve the built static site. Run the Worker first only for API routes so the
# multi-page site (clean directory URLs) is served directly from assets.
[assets]
directory = "../public"
binding = "ASSETS"
# not_found_handling serves 404.html for unknown paths (single-page fallback off).
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# KV namespace that stores leads and daily event counters.
# TODO(founder/deploy): replace `id` with the real KV namespace id from your
# Cloudflare account (the existing `showme-agency` worker already has one bound
# as LEADS — reuse that id so historic leads/stats stay intact).
[[kv_namespaces]]
binding = "LEADS"
id = "REPLACE_WITH_EXISTING_LEADS_KV_NAMESPACE_ID"
