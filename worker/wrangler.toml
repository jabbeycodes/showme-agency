# =============================================================================
# Cloudflare Worker config for the ShowMe Digital Agency site.
#
# The Worker serves the generated static site (../public) via Workers Static
# Assets, and runs custom code ONLY for /api/* (lead capture + analytics),
# falling back to the static assets for every other path.
#
# Deploy manually from this directory: npx wrangler deploy (see ../README.md).
# =============================================================================
name = "showme-agency"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Serve production on the agency subdomain as a Workers Custom Domain.
# (Cloudflare creates/manages the DNS record; there must be no other CNAME.)
routes = [{ pattern = "agency.showmeworld.app", custom_domain = true }]

# Keep the workers.dev URL for smoke-testing deploys.
workers_dev = true

# Serve the built static site. Run the Worker first only for API routes so the
# multi-page site (clean directory URLs) is served directly from assets.
[assets]
directory = "../public"
binding = "ASSETS"
# not_found_handling serves 404.html for unknown paths (single-page fallback off).
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# KV namespace that stores leads and daily event counters.
# This is the SAME namespace the previous inline worker used, so historic
# leads and stats stay intact. Never point this at a new/empty namespace.
[[kv_namespaces]]
binding = "LEADS"
id = "70f566bafd0c49928b97fdb2b56c0574" # showme-agency-leads (existing namespace; keeps historic leads/stats)
