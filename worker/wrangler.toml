# =============================================================================
# Cloudflare Worker config for the ShowMe Digital Agency site.
#
# The Worker serves the generated static site (../public) via Workers Static
# Assets, and runs custom code ONLY for /api/* (lead capture + analytics),
# falling back to the static assets for every other path.
#
# Deploy manually from this directory: npx wrangler deploy (see ../README.md).
# =============================================================================
name = "showme-agency"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Serve production on the agency subdomain as a Workers Custom Domain.
# (Cloudflare creates/manages the DNS record; there must be no other CNAME.)
routes = [{ pattern = "agency.showmeworld.app", custom_domain = true }]

# Keep the workers.dev URL for smoke-testing deploys.
workers_dev = true

# Serve the built static site. The Worker runs first for every request so it
# can handle /api/*, convert clean-URL 307s to 301s, return a real 404 status
# for /404(.html), and set cache/content-type headers (see src/index.js).
[assets]
directory = "../public"
binding = "ASSETS"
# not_found_handling serves 404.html for unknown paths (single-page fallback off).
not_found_handling = "404-page"
run_worker_first = true

# KV namespace that stores leads and daily event counters.
# This is the SAME namespace the previous inline worker used, so historic
# leads and stats stay intact. Never point this at a new/empty namespace.
[[kv_namespaces]]
binding = "LEADS"
id = "70f566bafd0c49928b97fdb2b56c0574" # showme-agency-leads (existing namespace; keeps historic leads/stats)

# ---- Free Digital Audit pipeline -------------------------------------------
# Workers AI phrases the audit priorities from structured findings only; the
# worker falls back to templated copy if the binding is unavailable.
[ai]
binding = "AI"

# Every 10 minutes: finish any lead alert / audit scan that the request-time
# ctx.waitUntil budget cut short, and send due follow-ups (if FOLLOWUP = "on").
[triggers]
crons = ["*/10 * * * *"]

# Non-secret settings. Secrets (set with `wrangler secret put`, never in git):
#   RESEND_API_KEY (required for email), ADMIN_KEY (required for /admin/),
#   PSI_API_KEY (optional, Google PageSpeed), GOOGLE_PLACES_API_KEY (optional).
[vars]
ALERT_TO = "info@showmeworld.app"
MAIL_FROM = "ShowMe Agency <info@showmeworld.app>"
REPLY_TO = "info@showmeworld.app"
AUTO_ACK = "off"   # "on" = email each lead an acknowledgement right away
FOLLOWUP = "off"   # "on" = send one follow-up 3 days after an APPROVED report
MAX_AUDITS_PER_DAY = "40"
